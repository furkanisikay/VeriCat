name: CI

# Her PR'da (açılışta ve her yeni push'ta): derle, test et, Windows exe'sini artefakt olarak yükle.
# Yalnızca pull_request'e bağlı: "push" da eklenirse PR dalına her push iki kez çalışır.
# main/master'a merge sonrası testler release.yml'de çalışır. PR'sız bir dal için: Actions → CI → Run workflow.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Derleme ve testler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore VeriCat.slnx
      - run: dotnet build VeriCat.slnx -c Release --no-restore
      - run: dotnet test VeriCat.slnx -c Release --no-build --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults

  publish:
    name: Windows exe (önizleme)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: .\build\publish.ps1 -SkipTests
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: VeriCat-win-x64
          path: artifacts/release/
          if-no-files-found: error
